name: Build and Release

on:
  push:
    tags: ['v*']
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4  # 升级到 v4
        
      - name: Build with Gradle
        run: ./gradlew build
      
      # ========== 调试：查看构建产物 ==========
      
      - name: Debug - List all JAR files
        run: |
          echo "=== 查找所有 JAR 文件 ==="
          find . -name "*.jar" -type f 2>/dev/null || echo "未找到 JAR"
          echo ""
          echo "=== build 目录结构 ==="
          ls -la build/ 2>/dev/null || echo "build 目录不存在"
          echo ""
          echo "=== build/libs 目录 ==="
          ls -la build/libs/ 2>/dev/null || echo "build/libs 不存在"

      # ========== 上传构建产物 ==========
      
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaystoneCurrencys-jar
          path: build/libs/*.jar
          if-no-files-found: warn
          include-hidden-files: true

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        if: hashFiles('build/distributions/*') != ''
        with:
          name: WaystoneCurrencys-distribution
          path: build/distributions/*
          if-no-files-found: warn