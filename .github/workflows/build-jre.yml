name: Build and Release

on:
  push:
    tags: ['v*']
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        
      - name: Build with Gradle
        run: ./gradlew build
      
      # ========== 新增：上传构建产物 ==========
      
      - name: Find build outputs
        id: find
        run: |
          # 查找构建产物（根据实际项目调整路径）
          echo "=== build/libs 目录 ==="
          ls -la build/libs/ || echo "目录不存在"
          
          echo "=== build/distributions 目录 ==="
          ls -la build/distributions/ || echo "目录不存在"
          
          # 记录主 jar 文件路径
          JAR_FILE=$(ls build/libs/*.jar | grep -v sources | grep -v javadoc | head -1)
          echo "jar=$JAR_FILE" >> $GITHUB_OUTPUT
          echo "Found main JAR: $JAR_FILE"
      
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaystoneCurrencys-jar
          path: build/libs/*.jar
          
      - name: Upload distributions (if shadowJar/plugin present)
        if: hashFiles('build/distributions/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: WaystoneCurrencys-distribution
          path: build/distributions/*